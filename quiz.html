<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>刷题 - 免费题库</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#0d0e12">
</head>
<body>
  <div class="container">
    <header class="topbar">
      <a class="logo" href="index.html">免费<span>题库</span></a>
      <nav><a href="index.html">首页</a><a href="exam.html">模拟考试</a><a href="wrong.html">错题本</a></nav>
    </header>
    <p id="crumb" style="color:var(--muted);font-size:14px;margin-bottom:20px"></p>

    <div class="quiz-box hidden" id="quiz-root">
      <div class="progress-wrap" id="progress">
        <div class="progress"><div></div></div>
        <span class="progress-num" id="progress-num"></span>
      </div>
      <div id="quiz-content"><!-- 题目由 js/quiz.js 动态渲染（进度条必须保留在本容器之外） --></div>
    </div>

    <footer>免费题库 · 仅供学习交流使用</footer>
  </div>
  <script src="js/app.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/track.js"></script>
  <script src="js/quiz.js"></script>
  <script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");</script>
</body>
</html>
